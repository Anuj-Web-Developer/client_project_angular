<div class="container-fluid bg-light vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg border-0 rounded-4 p-4" style="width: 420px;">

        <div class="text-center mb-4">
            <div class="text-center mb-4">

                <div class="logo-box">
                    <img src="assets/images/Navy Logo 5.png" alt="Customer Logo">
                </div>
                <!-- <i class="bi bi-person-circle text-primary" style="font-size: 70px;"></i> -->
                <h2 class="fw-semibold mt-1">
                    Login
                </h2>
                <p class="text-muted">
                    Sign in to your account
                </p>
            </div>
            <form (ngSubmit)="loginComponent()">
                <div class="mb-3">
                    <label class="form-label fw-semibold">
                        Email Address
                    </label>
                    <input type="email" class="form-control form-control-lg" placeholder="Enter Email" name="username"
                        [(ngModel)]="login.username">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>

                    <div class="password-wrapper">
                        <input class="form-control form-control-lg password-input" placeholder="Enter Password"
                            name="password" [(ngModel)]="login.password" [type]="showPassword ? 'text' : 'password'">

                        <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"
                            (click)="togglePassword()">
                        </i>
                    </div>
                </div>

                <div class="d-flex justify-content-between mb-4">
                    <a routerLink="/auth/forget-password" class="text-decoration-none">
                        Forget Password?
                    </a>

                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">
                    Login
                </button>
            </form>

            <!-- <button routerLink="/auth/customer-login" class="btn btn-primary btn-lg w-100 mt-2">Customer Login</button> -->
        </div>
    </div>
</div>
