<div class="container-fluid bg-light vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow-lg border-0 rounded-4 p-4" style="width: 450px;">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-primary" style="font-size:60px;"></i>
            <h2 class="fw-bold mt-3">Forgot Password</h2>
            <p class="text-muted">
                Verify your email and reset your password
            </p>
        </div>
        <form #formControl="ngForm">
            <!-- Email Section -->
            <div *ngIf="sendOTPActive" class="mb-4">

                <label class="form-label fw-semibold">
                    Email Address
                </label>

                <input type="email" class="form-control form-control-lg" placeholder="Enter your email" name="email"
                    [(ngModel)]="email" #emailModel="ngModel" required>

                <button type="button" class="btn btn-primary w-100 mt-3" (click)="sendOTP()">
                    Send OTP
                </button>
                
            </div>

            <!-- OTP Section -->
            <div *ngIf="verifyOTPActive" class="mb-4">

                <label class="form-label fw-semibold">
                    Enter OTP
                </label>

                <input type="text" class="form-control form-control-lg" placeholder="Enter 6-digit OTP" name="otp"
                    [(ngModel)]="otp" #otpModel="ngModel" maxlength="6" required>

                <button class=" resendOtp float-end mt-1" (click)="sendOTP()">Resend OTP
                    ?</button>

                <button type="button" class="btn btn-success w-100 mt-3" (click)="verifyOtp()">
                    Verify OTP
                </button>
            </div>

            <!-- Change Password -->
            <div *ngIf="verifyPassword">

                <label class="form-label fw-semibold">
                    New Password
                </label>

                <div class="input-group">
                    <input [type]="showNewPassword ? 'text' : 'password'" class="form-control form-control-lg mb-3"
                        placeholder="Enter new password" name="password" [(ngModel)]="user.password">

                    <button class="btn btn-outline-secondary" type="button" (click)="toggleNewPassword()">
                        <i class="bi" [ngClass]="showNewPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'">
                        </i>
                    </button>
                </div>

                <label class="form-label fw-semibold">
                    Confirm Password
                </label>
                <div class="input-group">
                    <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control form-control-lg mb-4"
                        placeholder="Re-enter new password" name="confirmPassword" [(ngModel)]="newPassword">

                    <button class="btn btn-outline-secondary" type="button" (click)="toggleConfirmPassword()">
                        <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'">
                        </i>
                    </button>
                </div>

                <button type="button" class="btn btn-danger btn-lg w-100" (click)="changePassword()">
                    Change Password
                </button>
            </div>
        </form>
    </div>
</div>
