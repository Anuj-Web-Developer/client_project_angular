<div class="container-fluid py-4">

    <div class="row justify-content-center">

        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

            <div class="card shadow border-0">

                <!-- Header -->
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0" style="color: black;">Update Password</h4>
                </div>

                <!-- Body -->
                <div class="card-body p-3 p-md-4">

                    <!-- New Password -->
                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            New Password
                        </label>

                        <div class="input-group">

                            <input
                                [type]="isVisibleNewPass?'text':'password'"
                                placeholder="Enter new password"
                                name="passwordModel"
                                #passwordModel="ngModel"
                                [(ngModel)]="password.password"
                                required
                                minlength="6"
                                class="form-control">

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                (click)="toggleNewPass()">

                               <i [class]="isVisibleNewPass ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>

                            </button>

                        </div>

                    </div>


                    <!-- Confirm Password -->
                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Confirm Password
                        </label>

                        <div class="input-group">

                            <input
                                [type]="isVisibleConfirmPass ? 'text':'password'"
                                placeholder="Enter confirm password"
                                name="confirmPass"
                                #confirmPass="ngModel"
                                [(ngModel)]="confirmPassword"
                                required
                                minlength="6"
                                class="form-control">

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                (click)="toggleConfirmPass()">

                                <i [class]="isVisibleConfirmPass ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>

                            </button>

                        </div>

                    </div>

                    <!-- Update Button -->
                    <div class="d-grid" style="background-color: #80cbf3;">
                        <button style="font-weight: 600;"
                            type="button"
                            class="btn " (click)="updatePassword()">
                            Update Password
                        </button>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
