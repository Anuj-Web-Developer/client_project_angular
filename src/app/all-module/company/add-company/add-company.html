<div class="container py-4">

    <!-- ===================== BASIC INFORMATION ===================== -->
    <div class="row mb-4">

        <div class="col col-md-6">
            <button type="button" class="btn btn-outline-none text-primary fs-6 fw-bold w-60" (click)="showBasicInfo()"
                [class.isActive1]="basicInfo" style="float:right; margin-right: 20px;">
                Basic Information
            </button>
        </div>

        <div class="col col-md-6">
            <button type="button" class="btn btn-outline-none text-primary fs-6 fw-bold w-60"
                (click)="showBillingInfo()" [class.isActive2]="billingInfo">
                Billing Information
            </button>
        </div>

    </div>


    <!-- ===================== BASIC INFORMATION ===================== -->
    <div *ngIf="basicInfo">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <!-- Heading -->
                <div class="mb-4">

                    <h2 class="h4 fw-bold mb-1">
                        Add Company Information
                    </h2>

                    <p class="text-muted mb-0">
                        Please provide your company details
                    </p>

                </div>


                <!-- Form Fields -->
                <div class="row g-3">

                    <!-- Full Name -->
                    <div class="col-12 col-md-6">

                        <label class="form-label fw-semibold">
                            Full Name
                        </label>

                        <input type="text" class="form-control" placeholder="Please enter your name" name="name"
                            #name="ngModel" [(ngModel)]="companyData.userName">

                    </div>


                    <!-- Mobile Number -->
                    <div class="col-12 col-md-6">

                        <label class="form-label fw-semibold">
                            Mobile Number
                        </label>

                        <input type="tel" class="form-control" placeholder="Please enter your mobile" name="mobile"
                            #mobile="ngModel" [(ngModel)]="companyData.mobile">

                    </div>


                    <!-- Email -->
                    <div class="col-12 col-md-6">

                        <label class="form-label fw-semibold">
                            Email Address
                        </label>

                        <input type="email" class="form-control" placeholder="Please enter email address" name="email"
                            #email="ngModel" [(ngModel)]="companyData.email">

                    </div>


                    <!-- Designation -->
                    <div class="col-12 col-md-6">

                        <label class="form-label fw-semibold">
                            Designation
                        </label>

                        <input type="text" class="form-control" placeholder="Please enter designation"
                            name="designation" #designation="ngModel" [(ngModel)]="companyData.designation">

                    </div>


                    <!-- Company Name -->
                    <div class="col-12 col-md-6">

                        <label class="form-label fw-semibold">
                            Company / Business Name
                        </label>

                        <input type="text" class="form-control" placeholder="Please enter company name"
                            name="companyName" #companyName="ngModel" [(ngModel)]="companyData.companyName">

                    </div>


                    <!-- Company Address -->
                    <div class="col-12 col-md-6">

                        <label class="form-label fw-semibold">
                            Company Address
                        </label>

                        <input type="text" class="form-control" placeholder="Please enter company's address"
                            name="companyAddress" #companyAddress="ngModel" [(ngModel)]="companyData.companyAddress">

                    </div>


                    <!-- Billing Address -->
                    <div class="col-12 col-md-6">

                        <label class="form-label fw-semibold">
                            Billing Address
                        </label>

                        <input type="text" class="form-control" placeholder="Please enter billing address"
                            name="billingAddress" #billingAddress="ngModel" [(ngModel)]="companyData.billingAddress">

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================== BILLING INFORMATION ===================== -->
    <div *ngIf="billingInfo">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <!-- Heading -->
                <div class="mb-4">

                    <h2 class="h4 fw-bold mb-1">
                        Add Billing Information
                    </h2>

                    <p class="text-muted mb-0">
                        Please provide billing details
                    </p>

                </div>


                <!-- Billing Fields -->
                <div class="row g-3">

                    <!-- GST -->
                    <div class="col-12 col-md-6">

                        <label class="form-label fw-semibold">
                            GSTIN / TAX ID
                        </label>

                        <input type="text" class="form-control" placeholder="Please enter GST / TAX ID" name="gstNo"
                            #gstNo="ngModel" [(ngModel)]="companyData.gstno">

                    </div>


                    <!-- Phone -->
                    <div class="col-12 col-md-6">

                        <label class="form-label fw-semibold">
                            Company Phone
                        </label>

                        <input type="tel" class="form-control" placeholder="Please enter telephone number"
                            name="companyPhone" #companyPhone="ngModel" [(ngModel)]="companyData.companyPhone">

                    </div>


                    <!-- Website -->
                    <div class="col-12 col-md-6">

                        <label class="form-label fw-semibold">
                            Website
                        </label>

                        <input type="url" class="form-control" placeholder="https://example.com" name="website"
                            #website="ngModel" [(ngModel)]="companyData.website">

                    </div>

                    <!-- Logo -->
                    <div class="col-12 col-md-6">

                        <label class="form-label fw-semibold">
                            Company Logo
                        </label>

                        <input type="file" class="form-control" name="companyLogo"
                            accept="image/png, image/jpeg, image/jpg" (change)="onLogoSelected($event)">

                        <small class="text-danger" *ngIf="backendErrors['logo']">
                            {{ backendErrors['logo'] }}
                        </small>

                    </div>
                    <!-- Signature -->
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold">
                            Signature
                        </label>
                        <div class="border rounded bg-white">
                            <canvas #signatureCanvas style="width: 100%; height: 180px;">
                            </canvas>
                        </div>
                        <button type="button" class="btn btn-sm btn-secondary mt-2" (click)="clearSignature()">
                            Clear
                        </button>

                        <h4>OR</h4>
                        <label class="form-label fw-semibold">
                            Upload Signature
                        </label>
                        <input type="file" class="form-control" name="companySignature"
                            accept="image/png, image/jpeg, image/jpg" (change)="onSignatureFileSelected($event)">

                        <small class="text-danger" *ngIf="backendErrors['signature']">
                            {{backendErrors['signature']}}
                        </small>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- ===================== BUTTONS ===================== -->
    <div class="d-flex justify-content-between mt-4 pt-3 border-top">

        <!-- <button type="button" class="btn btn-outline-secondary px-4" routerLink="/company">
            Back
        </button> -->

        <button type="button" class="back-button" routerLink="/company">
            <span>←</span>
            Back
        </button>

        <button type="button" class="btn  px-4" (click)="addCompany()" style="background: #80cbf3; color: black;">
            Update Project Information
        </button>

    </div>

</div>
