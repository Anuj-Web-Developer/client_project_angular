<div class="container py-4">
    <div class="profile-card mx-auto">
        <!-- Top Header Banner -->
        <div class="profile-header-banner">
            <!-- Back Button -->
            <!-- <button class="btn btn-back" routerLink="/customer/customer-dashboard">
                <i class="fa-solid fa-arrow-left me-2"></i> Back
            </button> -->

            <button type="button" class="back-button" routerLink="/customer/customer-dashboard">
                <span>←</span>
                Back
            </button>

            <div class="row">
                <div class="col-md-4 fw-bold"></div>
                <div class="col-md-8">
                    <span [class.bg.success]="customerData.status == 1" class="badge"
                        [class.bg-danger]="customerData.status != 1">
                        {{ customerData.status == 1 ? 'Active' : 'Inactive' }}
                    </span>
                </div>
            </div>

            <!-- Decorative Pattern -->
            <div class="banner-design-circle"></div>
        </div>
        <!-- Body Content -->
        <div class="profile-body-content">
            <!-- User Title Header -->
            <div class="profile-title text-center mb-4">
                <h2>{{customerData.name}}</h2>
            </div>
            <!-- Balanced 2-Column Grid -->
            <div class="profile-info-grid">
                <div class="info-box">
                    <label>Name</label>
                    <h6>{{customerData.name}}</h6>
                </div>

                <div class="info-box">
                    <label>Contact No</label>
                    <h6>{{customerData.contact}}</h6>
                </div>

                <div class="info-box">
                    <label>Adress</label>
                    <h6>{{customerData.address}}</h6>
                </div>

                <!-- <div class="info-box">
                    <label>Billing <Address></Address></label>
                    <h6>{{customerData.billingAddress}}</h6>
                </div> -->

                <div class="info-box">
                    <label>Company Name</label>
                    <h6>{{customerData.companyName}}</h6>
                </div>

                <!-- <div class="info-box">
                    <label>GST/Tax number</label>
                    <h6>{{customerData.gstNo}}</h6>
                </div> -->

                <div class="info-box">
                    <label>Email</label>
                    <h6>{{customerData.email}}</h6>
                </div>

                <div class="info-box">
                    <div class="col-md-4 fw-bold">Status</div>
                    <div class="col-md-8">
                        <span class="badge" [class.bg-success]="customerData.status == 1"
                            [class.bg-danger]="customerData.status != 1">
                            {{ customerData.status == 1 ? 'Active' : 'Inactive' }}
                        </span>
                    </div>
                </div>


                <!-- Edit Button (Bottom Right) -->
                <!-- <div class="d-flex justify-content-end mt-4 pt-2">
                <button class="btn btn-edit">
                    <i class="fa-solid fa-pen-to-square me-2"></i> Edit Profile
                </button>
            </div> -->
            </div>
        </div>
    </div>
